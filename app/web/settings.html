<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Face Attendance</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width:820px">
  <h1>Settings</h1>
  <form id="f" class="card">
    <label>Organisation name</label><input name="org_name">

    <label>Mode</label>
    <select name="mode">
      <option value="gate">Gate: one camera per direction (entrance = check-in, exit = check-out)</option>
      <option value="kiosk">Kiosk: every camera is a scan point (first scan = in, last scan = out)</option>
    </select>

    <h2 style="margin-top:20px">Cameras</h2>
    <div id="cams"></div>

    <h2 style="margin-top:20px">Working hours</h2>
    <div class="row">
      <div><label>Start</label><input type="time" name="work_start"></div>
      <div><label>End</label><input type="time" name="work_end"></div>
    </div>
    <div class="row">
      <div><label>Grace before "late" (minutes)</label><input type="number" name="late_grace_min" min="0"></div>
      <div><label>Ignore repeat scans within (seconds)</label><input type="number" name="cooldown_sec" min="5"></div>
    </div>

    <h2 style="margin-top:20px">Recognition</h2>
    <label>Match threshold: <b id="thv"></b> <span class="muted">(higher = stricter, fewer wrong names)</span></label>
    <input type="range" name="match_threshold" min="0.30" max="0.60" step="0.01">

    <label class="check"><input type="checkbox" name="display_enabled"> <span>Show the attendance screen on the HDMI monitor</span></label>

    <div style="margin-top:18px"><button class="primary">Save</button></div>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script src="/static/common.js"></script>
<script>
header("/settings");
const f = document.getElementById("f");
let current;
fetch("/api/settings").then(r => r.json()).then(s => {
  current = s;
  for (const k of ["org_name", "mode", "work_start", "work_end", "late_grace_min", "cooldown_sec", "match_threshold"]) f[k].value = s[k];
  f.display_enabled.checked = s.display_enabled;
  document.getElementById("thv").textContent = s.match_threshold;
  f.match_threshold.oninput = () => document.getElementById("thv").textContent = f.match_threshold.value;
  document.getElementById("cams").innerHTML = s.cameras.map((c, i) => `
    <div class="row" style="grid-template-columns: 1fr 1fr 2fr; align-items:end">
      <div><label>Name</label><input data-i="${i}" data-k="name" value="${esc(c.name)}"></div>
      <div><label>Direction</label><select data-i="${i}" data-k="role">
        <option value="in" ${c.role === "in" ? "selected" : ""}>Check-in</option>
        <option value="out" ${c.role === "out" ? "selected" : ""}>Check-out</option></select></div>
      <div class="muted" style="font-size:12px; padding-bottom:10px">${esc(c.device.replace("/dev/v4l/by-id/", ""))} · ${c.width}×${c.height}</div>
    </div>`).join("");
});
f.onsubmit = async e => {
  e.preventDefault();
  const body = {
    org_name: f.org_name.value, mode: f.mode.value, work_start: f.work_start.value, work_end: f.work_end.value,
    late_grace_min: +f.late_grace_min.value, cooldown_sec: +f.cooldown_sec.value,
    match_threshold: +f.match_threshold.value, display_enabled: f.display_enabled.checked,
    cameras: current.cameras.map((c, i) => ({ ...c,
      name: f.querySelector(`[data-i="${i}"][data-k="name"]`).value,
      role: f.querySelector(`[data-i="${i}"][data-k="role"]`).value })),
  };
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  showMsg(document.getElementById("msg"), r.ok ? "Saved." : "Could not save.", r.ok);
};
</script>
</body>
</html>
